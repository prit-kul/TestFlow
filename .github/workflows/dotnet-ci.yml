name: TestFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore TestFlow.sln

      - name: Build solution
        run: dotnet build TestFlow.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TestFlow.sln --no-build --configuration Release